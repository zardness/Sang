<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>

    <script>
        //생성자함수
        function Student(name, kor, mat,eng){
            this.name = name;
            this.kor = kor;
            this.mat = mat;
            this.eng = eng;
        }
        //메소드는 prototype에 추가
        Student.prototype.getSum = function(){
            return this.kor + this.mat + this.eng;
        };
        Student.prototype.getAvg = function(){
            return Math.round(this.getSum()/3)
        };
        Student.prototype.toString = function(){
            let output = '';
                    for(let key in this){
                        if(key!='getSum'&& key!='getAvg' && key!='toString'){
                            output += key + ':' + this[key] + '&nbsp;';
                    }else if(key=='getSum' || key=='getAvg'){
                        output += key.substring(3).toUpperCase()+':'+this[key]()+'&nbsp;';
                    }//if
                }//for
                return output;
        };
        let Students=[];
        
        Students.push(new Student('홍길동',99,98,97));
        Students.push(new Student('마길동',95,90,90));
        Students.push(new Student('김길동',59,92,92));
        Students.push(new Student('윤길동',91,60,77));
        Students.push(new Student('정길동',88,77,97));
        Students.forEach(element => document.write(element + '<br>'))
    </script>
</head>
<body>
    
</body>
</html>
