<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    
    <script>
// <!--   1. 참조:https://ko.wikipedia.org/wiki/%EC%A0%95%EA%B7%9C_%ED%91%9C%ED%98%84%EC%8B%9D
// 2. 간략문법
//     \d :(숫자와 매치 [0-9]와동일)
//     \D : (숫자가 아닌 문자)
//     \w : (영문자나 숫자.[a-zA-Z0-9]와 동일)
//     \W : (영문자나 숫자가 아닌 문자)
//     . : (문자)
//     \.: (.)
//     \s : ()
//     {n,} : n회 반복
//     {2,4} : 2-4회 반복
//     ? : (0번이나 1번의 의미)
//     + : (1번 이상 반복)
//     * : (0번이상 반복)
//  3.정규표현식 연습장 :
//     ex1.전화번호 패턴:0\d{1,2}[\-)\s\.]\d{3,4}[\-\s\.]\d{4},(\d{2,3}[\-)]?\d{3,4}-\d{4})|\d{2,3}|\d{9,11}
//     ex2.이메일 패턴 : \w[a-z0-9_]+@\w+(\.\w+){1,2}, \w[a-z0-9_\.]{3,}@\w+(\.\w+){1,2}
//     ex3)생년월일 :\d{2}(0[0-9]|1[0-2])(0[1-9]|[1-2]\d|3[01]),^\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])-[1-8]\d{6}$
//     ex4)주민등록번호 : \d{2}(0[1-9]|1[0-2])(0[1-9]|[1-2]\d|3[01])-?[1-4]\d{6}\b
    </script>
    <script>
        var str = 'abcd@ef';
        //패턴
        var patternNum = /[0-9]/; //숫자 (패턴)정규식표현
        var patternEng = /[a-zA-Z]/; //알파벳 문자 패턴 (정규표현식)
        var patternUpEng = /[A-Z]/; //대문자 패턴
        var patternLowEng = /[a-z]/; //소문자패턴
        var patternKor = /[가-힣]/; //한글문자 패턴 (정규표현식)
        var patternSpe = /[~`!@#$%^&*()_\-+=\|\\\[\]{}'":;?\/<>,\.]/; //특수문자 패턴
        //정규표현식 패턴.test(str) : str에 패턴이 포함되어있는지 여부
        document.write('str에 숫자포함 여부:' + patternNum.test(str)+'<br>')
        document.write('str에 알파벳포함 여부:' + patternEng.test(str)+'<br>')
        document.write('str에 한글포함 여부:' + patternKor.test(str)+'<br>')
        document.write('str에 특수문자포함 여부:' + patternSpe.test(str)+'<br>')
        document.write('str에 소문자 포함 여부:' + patternLowEng.test(str)+'<br>')
        document.write('str에 대문자 포함 여부:' + patternUpEng.test(str)+'<br>')
        //str.match(정규표현식 패턴) : str이 정규표현식 패턴과 일치하는지 여부
        //정규표현식과 매칭되는 문자열과 캡처그룹(괄호안)을 배열 return
        //정규표현식과 일치되지않으면 null을 return
        var patternEmail = /^\w[a-z0-9_]+@\w+(\.\w+){1,2}$/ 
        var str1 = 'hong@hong.com'
        var str2 = 'homn@hong.com@bbb'
        //match함수를 이용한 이메일 유효성 검사
        if(str1.match(patternEmail)){
            document.write('str1은 이메일 형식입니다.<br>');            
        }else{
            document.write('str1은 이메일 형식이 아닙니다.<br>');
        }
        document.write(str2.match(patternEmail));
        if(str2.match(patternEmail)){
            document.write('str2는 이메일 형식입니다.')
        }else{
            document.write('str2은 이메일 형식이 아닙니다.<br>');
        }
        //test함수를 이용한 이메일 유효성검사
        // document.write(patternEmail.test(str1));
        if(patternEmail.test(str1)){  
            document.write('str1는 이메일 형식입니다.')
        }else{
            document.write('str1은 이메일 형식이 아닙니다.<br>');
        }
        if(patternEmail.test(str2)){  
            document.write('str2는 이메일 형식입니다.')
        }else{
            document.write('str2은 이메일 형식이 아닙니다.<br>');
        }         
        
    </script>
