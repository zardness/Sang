<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    
    <script>
        
        let id = setTimeout(() => {
            document.body.innerHTML += '3초 지났다.';
        }, 3000);
        var cnt = 0; //while문 수행횃수
        let nowTime = new Date().getTime();// 현제의 밀리세컨
        while(new Date().getTime()<= nowTime + 2000){
            cnt++;
        }
        document.write('2초동안' + cnt + '번 while문 수행<br>');
    </script>
</head>

</body>
</html>
