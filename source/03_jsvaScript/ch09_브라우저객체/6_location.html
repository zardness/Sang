<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
    var sec = 0;
    var timeId = setInterval(()=>{
        sec++;
        document.body.innerHTML +=`<h${sec}>${sec}초 지남</h${sec}`;
    },1000);
    setTimeout(()=>{
        clearInterval(timeId);
        //페이지 변경 방법
        location.href = '7_history.html';
        //location = '7_history.html';
        // location.assign('7_history.html');
    },5000);
</script>
</head>
<body>
    <h1>잠시 후 페이지 이동이 있겠습니다</h1>
</body>
</html>
