<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <p>순서가 없는 목록태그(unorder)</p>
    <ul typeof="circle">
        <li>menu1</li><li>menu2</li><li>list Item</li>
    </ul>
    <p>순서가 있는 목록태그(order list)</p>
    <ol type="i">
       <li>menu1</li><li>menu2</li><li>list Item</li>
    </ol>
</body>
</html>
