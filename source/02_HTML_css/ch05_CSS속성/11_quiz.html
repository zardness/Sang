<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        a {
            text-decoration: none;
            color: purple;
            font-weight: bold;
            display:block;
        }
        li{list-style:none;}
        div{border:1px solid gray; 
            box-sizing:border-box;
            text-align:center;
            margin:5px;
            padding:5px;
        }
        #container {
            width: 820px;
            margin: 10px auto;
            padding: 5px;     
            position:relative;
            padding:0;
        }
        #backgroundimg {
            width: 100%;
            height: 100%;
            background: url('ch05/sulhyun.jpg') center no-repeat;
            position:absolute;
            margin:0;
            background-size:100%;
            z-index:-9999;
            opacity:0.3;
        }        
        #header{
            width:808px;                      
            background-color:yellow;
            text-align:center;
            line-height:80px;
            
        }
        #nav{            
            width:800;
            margin:5px 0;
            padding:10px;
            text-align:center;
        }
        #nav h2{            
            margin-bottom:10px;            
        }
        #nav ul{
            width:540px;
            margin:0 auto;
            overflow:hidden;
            border-radius:15px;          
        }
        #nav ul li{
            float:left;
            list-style:none;
        }
        #nav ul li a{
            display:block;
            width:108px;
            height:40px;
            line-height:40px;
            text-align:cener;
            background:pink;
            color:purple;
            font-weight:bold;
            border-right:1px solid white;            
        }   
                          
        #wrap{
            overflow:hidden;
            padding:8px;
        }
        #content{
            float:left;
            width:610px;
            height:260px;
            border:1px solid gray;
            text-align:center;
        }
        #content h3{margin-top:10px;}
        #side-banner{
            float:right;
            width:160px;
            height:260px;
            border:1px solid gray;
            text-align:center;
        }
        #side-banner h3{margin-top:10px;}
        #footer {
            width: 808px;
            background-color: yellow;
            text-align: center;
            line-height: 80px;
            margin: 5px 0;
        }        
    </style>
</head>
<body>
    <div id="container">

        </div>
        <div id="nav">

                <li>
