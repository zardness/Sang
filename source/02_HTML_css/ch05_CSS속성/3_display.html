<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div{width:100px; height:100px; border:1px solid black;}
        div:nth-child(1){background-color:red; margin:10px}
        div:nth-child(2){background-color:green; display:block;}
        div:nth-child(3){background-color:blue; display:inline; margin:20px;/*상우좌하*/}
        div:nth-child(4){display:none;} /*안보이게(공간도안보임*/
        div:nth-child(5){background-color:red; display:inline-block;}
        div:nth-child(6){background-color:green; display:inline-block;}
    </style>
</head>
<body>
    <div>conrent1</div>
    <div>conrent2</div>
    <div>conrent3</div>
    <div>conrent4</div>
    <div>conrent5</div>
    <div>conrent6</div>
    <div>conrent7</div>
</body>
</html>
