<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        *{margin:0; padding:0;}
        div#nav{
            width:800px;
            margin:10px auto;
        }
        #nav ul{overflow:hidden;} /*부모단*/
        #nav ul li{
            float:left;
            list-style:none;
            border:1px solid gray;
            padding:10px; 
            margin:2px;
            font-size:1.3em;/*글씨크기를 1.3배*/
        }
        #nav li > a{
            color:black;
            text-decoration:none;
        }
        #nav li:nth-child(2n){/*#nav 밑의 짝수번째 li*/
          background-color:yellow;
        }
        #nav li:nth-child(2n+1){/*홀수번쨰 li*/
          background-color:orange;
        }
        #nav li:first-child{/*#nav 아래 첫번째 li*/
          background-color:lightgrey;
          border-radius:20px 0 0 20px; /*좌상 우상 우하 좌하*/
        }
        #nav li:last-child{
            background-color:lightgrey;
            border-radius:0 20px 20px 0;
        }
    </style>
</head>
<body>
    <div id="nav">
        <ul>
            <li><a href="menu1">menu1</a></li>
            <li><a href="menu2">menu2</a></li>
            <li><a href="menu3">menu3</a></li>
            <li><a href="menu4">menu4</a></li>
            <li><a href="menu5">menu5</a></li>
            <li><a href="menu6">menu6</a></li>
            <li><a href="menu7">menu7</a></li>
            <li><a href="menu8">menu8</a></li>

        </ul>
    </div>
</body>
</html>
